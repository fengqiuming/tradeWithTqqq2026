name: 更新行情数据

on:
  # 为什么要两个定时点：
  #   · Yahoo 的当日日线要等到美东 22:00 左右才出（实测 22:13 ET 有了、21:26 ET 还没有，
  #     同期腾讯源已经有），而 GitHub 的 cron 又会延迟 2~3 小时，两者叠加使
  #     「按收盘时间排班」几乎必然拿到 T-1 的数据。
  #   · 所以主任务排在 02:00 UTC（= 22:00 ET，Tue~Sat UTC 覆盖 Mon~Fri ET），
  #     再留一个 06:00 UTC（= 02:00 ET）的兜底。主任务已拿到最新时，兜底因无变化跳过。
  schedule:
    - cron: '0 2 * * 2-6'
    - cron: '0 6 * * 2-6'
  workflow_dispatch:      # 允许手动触发
  push:
    paths:
      - 'scripts/fetch_data.py'
      - '.github/workflows/update-data.yml'

# 两个定时点 + 手动触发可能撞在一起；并发跑会互相把数据文件推来推去
concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取并校验行情
        env:
          # Alpha Vantage 免费 Key，在仓库 Settings → Secrets 里配置。
          # yfinance 可用时不会用到它；配了才能在 Yahoo 抽风时兜底。
          AV_API_KEY: ${{ secrets.AV_API_KEY }}
        run: python3 scripts/fetch_data.py

      - name: 检查数据是否变化
        id: diff
        run: |
          # -N（intent to add）：让尚未跟踪的新文件也出现在 git diff 里。
          # 否则首次运行时数据文件处于 untracked 状态，diff 恒为空、被误判为「无变化」。
          git add -N data/market.json data/market.js
          if git diff --quiet -- data/market.json data/market.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "数据无变化，跳过提交"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 提交
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # 远端可能已经前进，此时直接 push 必然 non-fast-forward：
          #   · 重跑失败的 run 时，checkout 固定在那次 run 创建时的旧 commit，
          #     而那次 run 自己其实已经把数据提交过一次了
          #   · 两个定时任务（21:30 / 04:00 UTC）偶尔挨得很近
          # data/ 是生成物，正确做法是丢掉本地提交、以远端为基准重建这一个提交，
          # 而不是 rebase 后祈祷没有冲突。
          git fetch --depth=1 origin main
          git reset --soft FETCH_HEAD
          git add data/market.json data/market.js
          git commit -m "chore: 更新行情数据 $(date -u +'%Y-%m-%d')"
          git push origin HEAD:main

      - name: 数据滞后告警
        if: always()
        run: |
          # 脚本内部已按交易日历重试约 11 分钟，走到这里仍 stale 说明上游没给数据。
          # 数据在上面照常提交过了（能更新多少算多少），这里只负责把问题说清楚：
          #   · 落后 1 个交易日：Yahoo 在收盘后数小时内迟迟不出当日 K 线，属常态。
          #     晚间兜底任务会补上，标黄不标红 —— 天天红就没人看了。
          #   · 落后 2 个交易日以上：要么数据源真的停了，要么复权口径变了，必须人看。
          if grep -q '"stale":true' data/market.json; then
            days=$(grep -o '"stale_days":[0-9]*' data/market.json | head -1 | cut -d: -f2)
            days=${days:-1}
            reason=$(grep -o '"stale_reason":"[^"]*"' data/market.json | head -1 | cut -d: -f2- | tr -d '"')
            if [ "$days" -ge 2 ]; then
              echo "::error::行情数据落后 $days 个交易日（数据源持续未给最新行情）"
              echo "$reason"
              exit 1
            fi
            echo "::warning::行情落后 1 个交易日，晚间兜底任务会自动重试"
            echo "$reason"
            exit 0
          fi
          echo "数据新鲜度正常"
